name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# مک و ویندوز به‌صورت جدا build می‌شوند (بدون انتشار)، سپس یک job واحد
# همه‌ی خروجی‌ها را در «یک» Release پیش‌نویس جمع می‌کند تا هیچ Draft تکراری/ناقص ساخته نشود.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build ${{ matrix.os }}
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          retention-days: 3
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create single draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          FILES=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) | sort -u)
          echo "فایل‌های Release:"; echo "$FILES"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$TAG" \
            --notes "حسابدار ساختمان توی دید — نسخه $TAG. نصب‌کننده‌ی ویندوز روی هر دو سیستم ۳۲ و ۶۴ بیتی کار می‌کند." \
            $FILES
